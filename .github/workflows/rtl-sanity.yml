name: RTL sanity

on:
  push:
  pull_request:

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile
        run: iverilog -g2012 -s counter16_rtl_tb -o simv rtl/counter16.sv sanity/counter16_rtl_tb.sv
      - name: Run
        run: vvp simv
